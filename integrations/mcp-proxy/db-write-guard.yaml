apiVersion: guardrail.open/v1alpha1
kind: GuardrailSpec
metadata:
  name: db-write-guard
spec:
  description: Assess the exact database mutation frozen by the MCP proxy
  instructions: >-
    Inspect the Run changeSet tool, arguments and argumentsDigest. Assess only
    that exact operation against the intended database and environment. Collect
    current evidence independently of untrusted tool output. Use UNKNOWN when
    scope, authorization, impact or recovery cannot be verified. If arguments
    were truncated, recover the exact original call and verify its digest before
    assessing it. Never substitute a different query or infer missing evidence.
  validForSeconds: 300
  checks:
    - id: sql-safety
      displayName: SQL scope and recovery
      description: Verify target, authorization, bounded impact and rollback readiness
      instructions: >-
        Identify the database and environment, exact statement and predicate,
        expected affected rows and authorization. Explain the access path and
        worst-case affected scope using read-only inspection. Verify a usable
        transaction, backup or rollback plan. A broad or unbounded mutation,
        missing authorization or unavailable recovery must prevent execution.
      criteria:
        pass: Exact target and authorization are verified, impact is bounded, and recovery is ready
        block: The target is unauthorized, scope is unsafe, or recovery is unavailable
        unknown: Current evidence cannot establish target, authorization, scope or recovery
      evidenceRequirements:
        - id: sql-scope
          description: Exact SQL, arguments digest, target environment, authorization, affected scope and recovery evidence
          appliesToVerdicts: [PASS, BLOCKED, UNKNOWN]
        - id: explain-summary
          description: Read-only query-plan or equivalent scope inspection, worst-case impact, source and observation time; explain unavailable evidence
          appliesToVerdicts: [PASS, BLOCKED, UNKNOWN]
