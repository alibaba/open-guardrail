name: Prepare preview release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: preview-release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  preflight:
    if: github.repository == 'alibaba/open-guardrail' && !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate reviewed preview tag and release notes
        id: version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          from pathlib import Path
          tag = os.environ['TAG_NAME']
          if not re.fullmatch(r'v\d+\.\d+\.\d+-(?:alpha|beta|rc)\.\d+', tag):
              raise SystemExit('Use a preview tag such as v0.1.0-alpha.0')
          if not Path('docs/releases/' + tag + '.md').is_file():
              raise SystemExit('Commit the version-specific release notes first')
          subprocess.run(['git', 'fetch', 'origin', '+refs/heads/main:refs/remotes/origin/main'], check=True)
          subprocess.run(['git', 'merge-base', '--is-ancestor', 'HEAD', 'origin/main'], check=True)
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('version=' + tag[1:] + '\ncommit=' + commit + '\n')
          PY
      - name: Require successful main CI for the exact source commit
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          result=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yaml/runs?head_sha=$SOURCE_COMMIT&branch=main&event=push&per_page=20" --jq '.workflow_runs[0].conclusion // "missing"')
          test "$result" = success || { echo 'Wait for this main commit CI to succeed, then rerun this workflow.'; exit 1; }

  plugin:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      BUNDLE: plugin-assets
      SYFT_SELECT_CATALOGERS: '+javascript-package-cataloger'
      SYFT_CHECK_FOR_APP_UPDATE: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Pack the one shared plugin without native builds
        run: python3 scripts/plugin-release.py --version "$VERSION" --output-dir "$BUNDLE" --plugin-only
      - name: Generate plugin SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          file: ${{ env.BUNDLE }}/openguardrail-agent-plugins-preview-${{ env.VERSION }}.tgz
          format: spdx-json
          syft-version: v1.57.1
          output-file: ${{ env.BUNDLE }}/openguardrail-agent-plugins-preview-${{ env.VERSION }}.tgz.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest shared plugin, installer and manifest
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ env.BUNDLE }}/*
      - name: Attest plugin SBOM
        id: plugin-sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ env.BUNDLE }}/openguardrail-agent-plugins-preview-${{ env.VERSION }}.tgz
          sbom-path: ${{ env.BUNDLE }}/openguardrail-agent-plugins-preview-${{ env.VERSION }}.tgz.spdx.json
      - name: Retain shared plugin proofs
        env:
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
          PLUGIN_SBOM: ${{ steps.plugin-sbom.outputs.bundle-path }}
        run: |
          cp "$PROVENANCE" "$BUNDLE/provenance.sigstore.json"
          cp "$PLUGIN_SBOM" "$BUNDLE/openguardrail-agent-plugins-preview-$VERSION.tgz.sbom.sigstore.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-plugin
          path: ${{ env.BUNDLE }}/*
          if-no-files-found: error
          retention-days: 14

  native:
    needs: [preflight, plugin]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: linux-amd64}
          - {os: ubuntu-24.04-arm, target: linux-arm64}
          - {os: macos-15-intel, target: darwin-amd64}
          - {os: macos-15, target: darwin-arm64}
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      SOURCE_COMMIT: ${{ needs.preflight.outputs.commit }}
      TARGET: ${{ matrix.target }}
      BUNDLE: dist/plugin-release-${{ needs.preflight.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      SYFT_SELECT_CATALOGERS: '+javascript-package-cataloger'
      SYFT_CHECK_FOR_APP_UPDATE: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-plugin
          path: shared-plugin
      - name: Authenticate the shared package before executing it
        run: |
          for file in shared-plugin/plugin-release.json shared-plugin/install.py shared-plugin/*.tgz; do
            gh attestation verify "$file" --bundle shared-plugin/provenance.sigstore.json \
              --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yaml" \
              --source-ref "$GITHUB_REF" --source-digest "$SOURCE_COMMIT" --deny-self-hosted-runners
          done
      - name: Build only this platform and test the shared plugin
        run: |
          python3 - <<'PY'
          import os, platform
          arch = {'x86_64': 'amd64', 'aarch64': 'arm64', 'arm64': 'arm64'}[platform.machine().lower()]
          assert platform.system().lower() + '-' + arch == os.environ['TARGET']
          PY
          python3 scripts/plugin-release.py --version "$VERSION" --output-dir "$BUNDLE" \
            --platform "$TARGET" --plugin-assets shared-plugin
          python3 scripts/smoke_release.py --version "$VERSION"
          python3 scripts/smoke-plugin-release.py --version "$VERSION" --assets-dir "$BUNDLE"
      - name: Stage this runner's verified native archive and tested plugin reference
        run: |
          mkdir release-assets
          native="open-guardrail-$VERSION-$TARGET.tar.gz"
          cp "$BUNDLE/$native" "$BUNDLE/$native.sha256" release-assets/
          cp "$BUNDLE/plugin-release.json" release-assets/platform-manifest.json
      - name: Generate native archive SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          file: release-assets/open-guardrail-${{ env.VERSION }}-${{ env.TARGET }}.tar.gz
          format: spdx-json
          syft-version: v1.57.1
          output-file: release-assets/open-guardrail-${{ env.VERSION }}-${{ env.TARGET }}.tar.gz.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest native build and tested plugin reference
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-assets/*
      - name: Attest native SBOM
        id: native-sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-assets/open-guardrail-${{ env.VERSION }}-${{ env.TARGET }}.tar.gz
          sbom-path: release-assets/open-guardrail-${{ env.VERSION }}-${{ env.TARGET }}.tar.gz.spdx.json
      - name: Retain native proofs
        env:
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
          NATIVE_SBOM: ${{ steps.native-sbom.outputs.bundle-path }}
        run: |
          cp "$PROVENANCE" release-assets/provenance.sigstore.json
          cp "$NATIVE_SBOM" "release-assets/open-guardrail-$VERSION-$TARGET.tar.gz.sbom.sigstore.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  collect:
    needs: [preflight, plugin, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      SOURCE_COMMIT: ${{ needs.preflight.outputs.commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: native-artifacts
      - name: Authenticate tested inputs and assemble the six user assets
        run: |
          verify_proof() {
            local artifact=$1 bundle=$2
            shift 2
            gh attestation verify "$artifact" --bundle "$bundle" \
              --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yaml" \
              --source-ref "$GITHUB_REF" --source-digest "$SOURCE_COMMIT" --deny-self-hosted-runners "$@"
          }
          for target in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            platform="native-artifacts/release-$target"
            archive="$platform/open-guardrail-$VERSION-$target.tar.gz"
            verify_proof "$platform/platform-manifest.json" "$platform/provenance.sigstore.json"
            verify_proof "$archive" "$platform/provenance.sigstore.json"
            verify_proof "$archive.spdx.json" "$platform/provenance.sigstore.json"
            verify_proof "$archive" "$archive.sbom.sigstore.json" \
              --predicate-type https://spdx.dev/Document/v2.3
          done
          common=native-artifacts/release-plugin
          for file in "$common/plugin-release.json" "$common/install.py" "$common"/*.tgz "$common"/*.tgz.spdx.json; do
            verify_proof "$file" "$common/provenance.sigstore.json"
          done
          plugin="$common/openguardrail-agent-plugins-preview-$VERSION.tgz"
          verify_proof "$plugin" "$plugin.sbom.sigstore.json" \
            --predicate-type https://spdx.dev/Document/v2.3
          python3 scripts/assemble-release.py --input native-artifacts --output release --version "$VERSION" --commit "$SOURCE_COMMIT"
      - name: Install the six public download files and check live readiness
        run: python3 scripts/smoke-plugin-release.py --version "$VERSION" --assets-dir release --public --doctor-only
      - name: Attest all final user assets
        id: final
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release/*
      - name: Retain final provenance outside the user download directory
        env:
          PROVENANCE: ${{ steps.final.outputs.bundle-path }}
        run: |
          mkdir proofs
          cp "$PROVENANCE" proofs/release-provenance.sigstore.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-release-assets
          path: release/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-release-provenance
          path: proofs/release-provenance.sigstore.json
          if-no-files-found: error
          retention-days: 14

  draft:
    needs: [preflight, collect]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.preflight.outputs.version }}
      SOURCE_COMMIT: ${{ needs.preflight.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-release-assets
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-release-provenance
          path: proofs
      - name: Verify all six user assets and the unchanged tag
        run: |
          git fetch --force origin "refs/tags/v$VERSION:refs/tags/v$VERSION"
          test "$(git rev-parse "v$VERSION^{commit}")" = "$SOURCE_COMMIT"
          python3 - <<'PY'
          import os
          from pathlib import Path
          version = os.environ['VERSION']
          expected = {'open-guardrail-' + version + '-' + target + '.tar.gz'
                      for target in ('linux-amd64', 'linux-arm64', 'darwin-amd64', 'darwin-arm64')}
          expected |= {'openguardrail-agent-plugins-preview-' + version + '-install.tar.gz', 'SHA256SUMS'}
          files = list(Path('release').iterdir())
          assert {path.name for path in files} == expected
          assert all(path.is_file() and not path.is_symlink() for path in files)
          PY
          (cd release && sha256sum -c SHA256SUMS)
          for file in release/*; do
            gh attestation verify "$file" --bundle proofs/release-provenance.sigstore.json \
              --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yaml" \
              --source-ref "$GITHUB_REF" --source-digest "$SOURCE_COMMIT" --deny-self-hosted-runners
          done
      - name: Create and read back a new draft containing exactly six attachments
        run: |
          assets=()
          for target in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            assets+=("release/open-guardrail-$VERSION-$target.tar.gz")
          done
          assets+=("release/openguardrail-agent-plugins-preview-$VERSION-install.tar.gz" "release/SHA256SUMS")
          gh release create "v$VERSION" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --draft --prerelease --title "OpenGuardrail v$VERSION" \
            --notes-file "docs/releases/v$VERSION.md"
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" \
            --json url,isDraft,isPrerelease,tagName,assets > release-state.json
          python3 - <<'PY'
          import json, os
          state = json.load(open('release-state.json'))
          version = os.environ['VERSION']
          expected = {'open-guardrail-' + version + '-' + target + '.tar.gz'
                      for target in ('linux-amd64', 'linux-arm64', 'darwin-amd64', 'darwin-arm64')}
          expected |= {'openguardrail-agent-plugins-preview-' + version + '-install.tar.gz', 'SHA256SUMS'}
          assert state['isDraft'] and state['isPrerelease'] and state['tagName'] == 'v' + version
          assert len(state['assets']) == 6 and {asset['name'] for asset in state['assets']} == expected
          print(json.dumps(state, indent=2))
          PY
