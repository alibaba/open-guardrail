name: Deploy product website

on:
  push:
    branches: [main]
    paths:
      - 'pages/**'
      - 'docs/**'
      - 'README.md'
      - 'cmd/guardrailctl/README.md'
      - 'integrations/README.md'
      - 'examples/resource-bindings/**'
      - '.github/workflows/deploy-pages.yml'
  pull_request:
    paths:
      - 'pages/**'
      - 'docs/**'
      - 'README.md'
      - 'cmd/guardrailctl/README.md'
      - 'integrations/README.md'
      - 'examples/resource-bindings/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pages/package-lock.json
      - name: Install website dependencies
        working-directory: pages
        run: npm ci --ignore-scripts
      - name: Check website behavior
        working-directory: pages
        run: npm run check
      - name: Build for the repository Pages path
        working-directory: pages
        env:
          SITE_BASE_PATH: /${{ github.event.repository.name }}/
          SITE_ORIGIN: https://${{ github.repository_owner }}.github.io
        run: npm run build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: pages/dist

  deploy:
    if: github.repository == 'alibaba/open-guardrail' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90192f30c52f2945d0bbad98c5aa18402b1e # v4.0.5
