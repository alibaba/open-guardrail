server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;

    location / {
        proxy_pass http://guardrail:8080;
        proxy_http_version 1.1;
        # Preserve the port too: the application compares the exact public origin.
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        # The application does not trust forwarding headers for identity.
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Real-IP "";
        proxy_connect_timeout 5s;
        # Response idle timeout exceeds the server's 10s cooperative request
        # budget and 15s socket write timeout. Long tasks need an asynchronous
        # API or coordinated server/proxy timeout changes.
        proxy_read_timeout 20s;
    }
}
