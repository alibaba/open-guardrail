openapi: 3.0.3
info:
  title: OpenGuardrail API
  version: 0.1.0-alpha.0
  description: Standalone Scene and Policy management requires no account or Project key. Runs retain scoped Submission credentials. Enterprise trusted-operator access remains API-only and checks Policy maintainers.
paths:
  /livez:
    get:
      operationId: getLiveness
      responses:
        '200':
          description: Process is alive; this check has no database dependency
          headers: {X-Trace-ID: {$ref: '#/components/headers/TraceID'}}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /readyz:
    get:
      operationId: getReadiness
      responses:
        '200':
          description: Database is reachable and schema is current
          headers: {X-Trace-ID: {$ref: '#/components/headers/TraceID'}}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Database or schema is unavailable
          headers: {X-Trace-ID: {$ref: '#/components/headers/TraceID'}}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1alpha1/meta/version:
    get:
      operationId: getVersion
      responses:
        '200':
          description: Server build metadata
          headers: {X-Trace-ID: {$ref: '#/components/headers/TraceID'}}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
  /api/v1alpha1/meta/capabilities:
    get:
      operationId: getCapabilities
      responses:
        '200':
          description: Public API, CLI compatibility and feature discovery
          headers: {X-Trace-ID: {$ref: '#/components/headers/TraceID'}}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
        '503':
          description: Runtime capability provider returned an unsupported value
          headers: {X-Trace-ID: {$ref: '#/components/headers/TraceID'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /openapi.yaml:
    get:
      operationId: getOpenAPI
      responses:
        '200':
          description: This OpenAPI document
          headers: {X-Trace-ID: {$ref: '#/components/headers/TraceID'}}
          content:
            application/yaml:
              schema:
                type: string
  /runtime/v1alpha1/runs:
    get: {"operationId":"listPolicyRuns","description":"List Runs in the default project. sceneKey and businessId together select at most one Run.","parameters":[{"$ref":"#/components/parameters/RunStatusFilter"},{"$ref":"#/components/parameters/RunSceneFilter"},{"$ref":"#/components/parameters/RunBusinessIDFilter"},{"$ref":"#/components/parameters/RunLimit"},{"$ref":"#/components/parameters/RunCursor"}],"security":[],"responses":{"default":{"$ref":"#/components/responses/RunError"},"200":{"description":"Success","headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/PolicyRunPage"}}}}}}
    post: {"operationId":"createPolicyRun","security":[],"responses":{"201":{"description":"Success","headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/PolicyRunCreation"}}}},"default":{"$ref":"#/components/responses/RunError"},"200":{"description":"Idempotent or business ID replay; credential is not reissued","headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/PolicyRun"}}}}},"description":"Creates from the Scene default active Revision unless an explicit Revision or resource binding selects another Revision. Same Idempotency-Key or same businessId and content replays without reissuing the credential. A businessId remains bound to its Run after FINISHED or EXPIRED; use a new businessId for a new Run attempt.","parameters":[{"$ref":"#/components/parameters/IdempotencyKey"},{"$ref":"#/components/parameters/CSRF"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/CreatePolicyRunRequest"}}}}}
  /runtime/v1alpha1/runs/{runId}:
    get: {"operationId":"getPolicyRun","description":"Read a Run in the default project.","security":[],"responses":{"200":{"description":"Success","headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/PolicyRun"}}}},"default":{"$ref":"#/components/responses/RunError"}},"parameters":[{"name":"runId","in":"path","required":true,"schema":{"type":"string"}}]}
  /runtime/v1alpha1/runs/{runId}/submission-credential:rotate:
    post: {"operationId":"rotatePolicySubmissionCredential","description":"Rotate this Run's submission credential and revoke the previous credential.","security":[],"responses":{"201":{"description":"Success","headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/RunSubmissionCredential"}}}},"default":{"$ref":"#/components/responses/RunError"}},"parameters":[{"name":"runId","in":"path","required":true,"schema":{"type":"string"}}]}
  /runtime/v1alpha1/runs/{runId}/submissions:
    post: {"operationId":"submitSnapshot","security":[{"SubmissionCredential":[]}],"responses":{"201":{"description":"Success","headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/SnapshotSubmission"}}}},"default":{"$ref":"#/components/responses/RunError"},"200":{"description":"Idempotent replay of the accepted Submission","headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/SnapshotSubmission"}}}}},"description":"Full Snapshot with baseSubmissionNo CAS. finishRun=false keeps the Run OPEN; finishRun=true freezes Result and Decision. Verdict is derived from Check verdicts.","parameters":[{"name":"runId","in":"path","required":true,"schema":{"type":"string"}},{"$ref":"#/components/parameters/IdempotencyKey"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/SnapshotSubmitRequest"}}}}}
  /api/v1alpha1/runs:
    get: {"operationId":"listManagedPolicyRuns","parameters":[{"$ref":"#/components/parameters/RunStatusFilter"},{"$ref":"#/components/parameters/RunSceneFilter"},{"$ref":"#/components/parameters/RunBusinessIDFilter"},{"$ref":"#/components/parameters/RunLimit"},{"$ref":"#/components/parameters/RunCursor"}],"security":[],"responses":{"200":{"description":"Success","headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/PolicyRunPage"}}}},"default":{"$ref":"#/components/responses/RunError"}}}
  /api/v1alpha1/runs/{runId}:
    get: {"operationId":"getManagedPolicyRun","security":[],"responses":{"200":{"description":"Success","headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/PolicyRun"}}}},"default":{"$ref":"#/components/responses/RunError"}},"parameters":[{"name":"runId","in":"path","required":true,"schema":{"type":"string"}}]}
  /api/v1alpha1/runs/{runId}/submissions:
    get:
      operationId: listManagedRunSubmissions
      description: Paginated submission metadata in the default project. Fetch evidence through the selected Submission reader.
      security: []
      parameters:
        - {name: runId, in: path, required: true, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
        - {name: before, in: query, schema: {type: integer, format: int64, minimum: 1}}
      responses:
        "200":
          description: Newest-first metadata without evidence payloads
          headers: {X-Trace-ID: {$ref: "#/components/headers/TraceID"}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SubmissionPage"}
        default: {$ref: "#/components/responses/RunError"}
  /api/v1alpha1/runs/{runId}/submissions/{submissionId}:
    get: {"operationId":"getManagedRunSubmission","description":"Read a stored Submission and its evidence within the default project and selected Run.","security":[],"parameters":[{"name":"runId","in":"path","required":true,"schema":{"type":"string"}},{"name":"submissionId","in":"path","required":true,"schema":{"type":"string"}}],"responses":{"200":{"description":"Immutable stored Submission","headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/StoredSubmission"}}}},"default":{"$ref":"#/components/responses/RunError"}}}
  /api/v1alpha1/scenes:
    get: {"operationId":"listSceneModels","security":[],"responses":{"200":{"description":"Success","headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/SceneModelList"}}}},"default":{"$ref":"#/components/responses/SpecError"}}}
  /api/v1alpha1/scenes/{key}:initialize:
    post: {"operationId":"initializeScene","security":[],"responses":{"201":{"description":"Success","headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/InitializedScene"}}}},"default":{"$ref":"#/components/responses/SpecError"}},"description":"Atomically create Scene, default Policy, Revision 1 and activation. Retry with the same Idempotency-Key.","parameters":[{"name":"key","in":"path","required":true,"schema":{"type":"string"}},{"$ref":"#/components/parameters/CSRF"},{"$ref":"#/components/parameters/IdempotencyKey"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/InitializeSceneRequest"}}}}}
  /api/v1alpha1/scenes/{key}:
    get: {"operationId":"getSceneModel","security":[],"responses":{"200":{"description":"Success","headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/SceneModel"}}}},"default":{"$ref":"#/components/responses/SpecError"}},"parameters":[{"name":"key","in":"path","required":true,"schema":{"type":"string"}}]}
    patch: {"operationId":"setSceneTTL","security":[],"responses":{"200":{"description":"Success","headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/SceneModel"}}}},"default":{"$ref":"#/components/responses/SpecError"}},"parameters":[{"name":"key","in":"path","required":true,"schema":{"type":"string"}},{"$ref":"#/components/parameters/CSRF"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/SetSceneTTLRequest"}}}}}
  /api/v1alpha1/scenes/{key}/policies:
    get: {"operationId":"listPolicies","security":[],"responses":{"200":{"description":"Success","headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/PolicyList"}}}},"default":{"$ref":"#/components/responses/SpecError"}},"parameters":[{"name":"key","in":"path","required":true,"schema":{"type":"string"}}]}
    post: {"operationId":"createPolicy","description":"New Policies require specKey. Only exact retries of pre-upgrade creation records may omit it. It is unique within the Project and Scene, immutable, and must equal YAML metadata.name in every Revision. name is a display label and need not be unique. Optional resource is bound atomically; an existing resource binding causes a conflict without creating another Policy.","security":[],"responses":{"201":{"description":"Success","headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/Policy"}}}},"default":{"$ref":"#/components/responses/SpecError"}},"parameters":[{"name":"key","in":"path","required":true,"schema":{"type":"string"}},{"$ref":"#/components/parameters/CSRF"},{"$ref":"#/components/parameters/IdempotencyKey"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/CreatePolicyRequest"}}}}}
  /api/v1alpha1/scenes/{key}/bindings:
    get: {"operationId":"listBindings","security":[],"parameters":[{"name":"key","in":"path","required":true,"schema":{"type":"string"}},{"name":"limit","in":"query","schema":{"type":"integer","minimum":1,"maximum":100,"default":20}},{"name":"after","in":"query","schema":{"type":"string","maxLength":1366}}],"responses":{"200":{"description":"Success","content":{"application/json":{"schema":{"$ref":"#/components/schemas/BindingPage"}}},"headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}}},"default":{"$ref":"#/components/responses/SpecError"}}}
  /api/v1alpha1/scenes/{key}/bindings/{kind}/{resourceId}:
    put: {"operationId":"putBinding","security":[],"parameters":[{"name":"key","in":"path","required":true,"schema":{"type":"string"}},{"name":"kind","in":"path","required":true,"schema":{"type":"string"}},{"name":"resourceId","in":"path","required":true,"schema":{"type":"string"}},{"$ref":"#/components/parameters/CSRF"}],"description":"Idempotently create or replace a resource binding within this scene. If-None-Match: * allows only an absent or already identical binding; a different existing binding conflicts. Omit policyRevisionId to follow the Policy active revision. Resource IDs containing slash must be URL-encoded.","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/PutBindingRequest"}}}},"responses":{"200":{"description":"Success","content":{"application/json":{"schema":{"$ref":"#/components/schemas/PolicyBinding"}}},"headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}}},"default":{"$ref":"#/components/responses/SpecError"}}}
    delete: {"operationId":"deleteBinding","security":[],"parameters":[{"name":"key","in":"path","required":true,"schema":{"type":"string"}},{"name":"kind","in":"path","required":true,"schema":{"type":"string"}},{"name":"resourceId","in":"path","required":true,"schema":{"type":"string"}},{"$ref":"#/components/parameters/CSRF"}],"responses":{"204":{"description":"Binding absent; repeated deletion also succeeds","headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}}},"default":{"$ref":"#/components/responses/SpecError"}}}
  /api/v1alpha1/scenes/{key}/default-policy:
    put: {"operationId":"setDefaultPolicy","security":[],"responses":{"200":{"description":"Success","headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/SceneModel"}}}},"default":{"$ref":"#/components/responses/SpecError"}},"parameters":[{"name":"key","in":"path","required":true,"schema":{"type":"string"}},{"$ref":"#/components/parameters/CSRF"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/SetDefaultPolicyRequest"}}}}}
  /api/v1alpha1/policies/{policyId}:
    get: {"operationId":"getPolicy","security":[],"responses":{"200":{"description":"Success","headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/Policy"}}}},"default":{"$ref":"#/components/responses/SpecError"}},"parameters":[{"name":"policyId","in":"path","required":true,"schema":{"type":"string"}}]}
  /api/v1alpha1/policies/{policyId}/maintainers:
    put: {"operationId":"setPolicyMaintainers","description":"Replace this Spec maintainer list; empty lists are rejected. Enterprise trusted-operator mode requires a current maintainer.","security":[],"parameters":[{"name":"policyId","in":"path","required":true,"schema":{"type":"string"}},{"$ref":"#/components/parameters/CSRF"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/SetPolicyMaintainersRequest"}}}},"responses":{"200":{"description":"Updated Policy","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Policy"}}},"headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}}},"default":{"$ref":"#/components/responses/SpecError"}}}
  /api/v1alpha1/policies/{policyId}/draft:
    put: {"operationId":"savePolicyDraft","security":[],"responses":{"200":{"description":"Success","headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/PolicyRevision"}}}},"default":{"$ref":"#/components/responses/SpecError"}},"parameters":[{"name":"policyId","in":"path","required":true,"schema":{"type":"string"}},{"$ref":"#/components/parameters/CSRF"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/PolicyDraftRequest"}}}},"description":"Save this Spec Draft. Enterprise trusted-operator mode requires a maintainer of this Spec."}
    get: {"operationId":"getPolicyDraft","security":[],"parameters":[{"name":"policyId","in":"path","required":true,"schema":{"type":"string"}}],"description":"Return the current DRAFT Revision, or NOT_FOUND when no draft exists.","responses":{"200":{"description":"Draft Revision","headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/PolicyRevision"}}}},"default":{"$ref":"#/components/responses/SpecError"}}}
  /api/v1alpha1/policies/{policyId}/draft:publish:
    post: {"operationId":"publishPolicyDraft","security":[],"responses":{"201":{"description":"Success","headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/PolicyRevision"}}}},"default":{"$ref":"#/components/responses/SpecError"}},"parameters":[{"name":"policyId","in":"path","required":true,"schema":{"type":"string"}},{"$ref":"#/components/parameters/CSRF"},{"$ref":"#/components/parameters/IdempotencyKey"}],"description":"Publish only the exact Draft YAML reviewed by the caller. The required yaml must match the stored Draft under its lock; otherwise return RESOURCE_STATE_CONFLICT. Retry the same Idempotency-Key with the same yaml. Enterprise trusted-operator mode requires a maintainer of this Spec.","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/PolicyDraftRequest"}}}}}
  /api/v1alpha1/policies/{policyId}/revisions:
    get: {"operationId":"listPolicyRevisions","security":[],"responses":{"200":{"description":"Success","headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/PolicyRevisionPage"}}}},"default":{"$ref":"#/components/responses/SpecError"}},"parameters":[{"name":"policyId","in":"path","required":true,"schema":{"type":"string"}},{"name":"pageSize","in":"query","schema":{"type":"integer","minimum":1,"maximum":100,"default":20}},{"name":"before","in":"query","schema":{"type":"integer","format":"int64","minimum":1}}],"description":"Returns a bounded page of summaries without YAML. Fetch content by revision ID. before is the exclusive revision-number cursor; new publications do not shift older pages."}
    post: {"operationId":"publishPolicyRevision","description":"Publish an immutable Revision from the supplied YAML under this Policy. Retry the same Idempotency-Key with the same content. Enterprise trusted-operator mode requires a maintainer of this Spec.","security":[],"responses":{"201":{"description":"Success","headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/PolicyRevision"}}}},"default":{"$ref":"#/components/responses/SpecError"}},"parameters":[{"name":"policyId","in":"path","required":true,"schema":{"type":"string"}},{"$ref":"#/components/parameters/CSRF"},{"$ref":"#/components/parameters/IdempotencyKey"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/PublishPolicyRevisionRequest"}}}}}
  /api/v1alpha1/policies/{policyId}/active-revision:
    put: {"operationId":"activatePolicyRevision","security":[],"responses":{"200":{"description":"Success","headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/Policy"}}}},"default":{"$ref":"#/components/responses/SpecError"}},"parameters":[{"name":"policyId","in":"path","required":true,"schema":{"type":"string"}},{"$ref":"#/components/parameters/CSRF"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ActivatePolicyRevisionRequest"}}}},"description":"Select this Policy's active immutable Revision. Enterprise trusted-operator mode requires a maintainer of this Spec."}
  /api/v1alpha1/policies/{policyId}:archive:
    post: {"operationId":"archivePolicy","security":[],"responses":{"200":{"description":"Success","headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/Policy"}}}},"default":{"$ref":"#/components/responses/SpecError"}},"parameters":[{"name":"policyId","in":"path","required":true,"schema":{"type":"string"}},{"$ref":"#/components/parameters/CSRF"}]}
  /api/v1alpha1/policies/{policyId}:unarchive:
    post: {"operationId":"unarchivePolicy","security":[],"responses":{"200":{"description":"Success","headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/Policy"}}}},"default":{"$ref":"#/components/responses/SpecError"}},"parameters":[{"name":"policyId","in":"path","required":true,"schema":{"type":"string"}},{"$ref":"#/components/parameters/CSRF"}]}
  /api/v1alpha1/policy-revisions/{revisionId}:
    get: {"operationId":"getPolicyRevision","security":[],"responses":{"200":{"description":"Success","headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/PolicyRevision"}}}},"default":{"$ref":"#/components/responses/SpecError"}},"parameters":[{"name":"revisionId","in":"path","required":true,"schema":{"type":"string"}}]}
  /runtime/v1alpha1/runs/{runId}/policy-revision:
    get: {"operationId":"getRunPolicyRevision","description":"Read this Run's frozen immutable Revision in the default project.","security":[],"parameters":[{"name":"runId","in":"path","required":true,"schema":{"type":"string"}}],"responses":{"200":{"description":"Run-scoped immutable content","content":{"application/json":{"schema":{"$ref":"#/components/schemas/PolicyRevision"}}},"headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}}},"default":{"$ref":"#/components/responses/RunError"}}}
  /runtime/v1alpha1/runs/{runId}/submissions/{submissionId}:
    get: {"operationId":"getRunSubmission","description":"Read an accepted Submission of this Run in the default project.","security":[],"parameters":[{"name":"runId","in":"path","required":true,"schema":{"type":"string"}},{"name":"submissionId","in":"path","required":true,"schema":{"type":"string"}}],"responses":{"200":{"description":"Run-scoped immutable content","content":{"application/json":{"schema":{"$ref":"#/components/schemas/StoredSubmission"}}},"headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}}},"default":{"$ref":"#/components/responses/RunError"}}}
  /api/v1alpha1/audit-events:
    get: {"operationId":"listAuditEvents","security":[],"description":"Read one project-scoped audit page in descending event ID order. Cursors are bound to filters and scope. Unscoped historical events are excluded. Detail objects above 4096 bytes are unavailable.","parameters":[{"name":"eventType","in":"query","schema":{"type":"string","maxLength":512}},{"name":"actorId","in":"query","schema":{"type":"string","maxLength":512}},{"name":"resourceType","in":"query","schema":{"type":"string","maxLength":512}},{"name":"resourceId","in":"query","schema":{"type":"string","maxLength":512}},{"name":"cursor","in":"query","schema":{"type":"string","maxLength":2048}},{"name":"from","in":"query","description":"Unix seconds; from is inclusive and to is exclusive.","schema":{"type":"integer","format":"int64","minimum":0}},{"name":"to","in":"query","description":"Unix seconds; from is inclusive and to is exclusive.","schema":{"type":"integer","format":"int64","minimum":0}},{"name":"limit","in":"query","schema":{"type":"integer","minimum":1,"maximum":100,"default":20}},{"name":"redacted","in":"query","description":"Return actor/resource fingerprints and omit stored detail contents for sharing.","schema":{"type":"boolean"}}],"responses":{"200":{"description":"Success","headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/AuditPage"}}}},"default":{"$ref":"#/components/responses/SpecError"}}}
  /api/v1alpha1/runs/{runId}/report:
    get: {"operationId":"getManagedRunReport","security":[],"description":"Structured diagnostic export with frozen Revision metadata, content fingerprints and up to 20 submission summaries captured at the initial Run read. Raw YAML, changeSet and free-text evidence are omitted. generatedAt is a diagnostic observation time.","parameters":[{"name":"runId","in":"path","required":true,"schema":{"type":"string"}}],"responses":{"200":{"description":"Success","headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/RunReport"}}}},"default":{"$ref":"#/components/responses/RunError"}}}
  /runtime/v1alpha1/runs/{runId}/report:
    get: {"operationId":"getRunReport","security":[],"description":"Structured diagnostic export with frozen Revision metadata, content fingerprints and up to 20 submission summaries captured at the initial Run read. Raw YAML, changeSet and free-text evidence are omitted. generatedAt is a diagnostic observation time.","parameters":[{"name":"runId","in":"path","required":true,"schema":{"type":"string"}}],"responses":{"200":{"description":"Success","headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/RunReport"}}}},"default":{"$ref":"#/components/responses/RunError"}}}
components:
  headers:
    TraceID:
      description: Opaque request correlation identifier generated by the server; safe to include in support reports
      required: true
      schema: {type: string, pattern: '^[a-f0-9]{32}$'}
  securitySchemes:
    SubmissionCredential: {type: http, scheme: bearer, description: Run-scoped credential accepted only by that Run's Submission endpoint}
  parameters:
    SceneKey:
      name: key
      in: path
      required: true
      schema: {$ref: '#/components/schemas/SceneKey'}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        pattern: '^[a-zA-Z0-9][a-zA-Z0-9._:-]{0,127}$'
      description: Stable caller operation ID; scoped to the default Project and not a credential or Run ID
    RunStatusFilter:
      name: status
      in: query
      schema: {$ref: '#/components/schemas/RunStatus'}
      description: Optional effective Run status. Overdue OPEN Runs match EXPIRED rather than OPEN.
    RunSceneFilter:
      name: sceneKey
      in: query
      schema: {$ref: '#/components/schemas/SceneKey'}
      description: Optional exact Scene key.
    RunBusinessIDFilter:
      name: businessId
      in: query
      schema: {type: string, minLength: 1, maxLength: 128}
      description: Optional exact caller-owned business correlation ID, permanently bound to one Run. Combine with sceneKey for one Run.
    RunLimit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      description: Maximum number of Runs returned.
    RunCursor:
      name: cursor
      in: query
      schema: {type: string, minLength: 1, maxLength: 512}
      description: Opaque cursor returned by the preceding page. Do not inspect or construct it.
    CSRF:
      name: X-Guardrail-CSRF
      in: header
      required: true
      schema: {type: string, enum: ['1']}
      description: >
        Required for all management mutations. Browser requests must also pass exact
        Origin/Host and Sec-Fetch-Site checks. No cross-origin CORS is enabled.
  responses:
    RunError:
      description: >
        400 INVALID_ARGUMENT; 401 UNAUTHENTICATED; 403 PERMISSION_DENIED; 404 NOT_FOUND;
        409 SPEC_NOT_PUBLISHED, BINDING_CONFLICT, IDEMPOTENCY_CONFLICT, BUSINESS_ID_CONFLICT, RUN_FINISHED or BASE_SUBMISSION_MISMATCH; 410 RUN_EXPIRED;
        422 INVALID_SUBMISSION, VERDICT_MISMATCH or SENSITIVE_EVIDENCE_DETECTED; 503 RUN_UNAVAILABLE.
        Cross-Project reads return 404. Only Snapshot submission requires the Run Submission credential; management and runtime reads use the default project.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
      headers: {X-Trace-ID: {$ref: '#/components/headers/TraceID'}}
    SpecError:
      description: >
        400 INVALID_ARGUMENT; 401 UNAUTHENTICATED; 403 PERMISSION_DENIED, UNTRUSTED_ORIGIN or CSRF_REQUIRED;
        404 NOT_FOUND; 409 RESOURCE_STATE_CONFLICT, SCENE_ALREADY_INITIALIZED, SPEC_KEY_CONFLICT or SPEC_KEY_MISMATCH; 422 SPEC_VALIDATION_FAILED with safe validation guidance;
        503 SPEC_UNAVAILABLE.
        Scene mutations require X-Guardrail-CSRF and exact Host/Origin checks.
        Copy unsaved edits before reloading after a conflict.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
      headers: {X-Trace-ID: {$ref: '#/components/headers/TraceID'}}
