openapi: 3.0.3
info:
  title: OpenGuardrail API
  version: 0.1.0-alpha.0
  description: Local administrator sessions, Scene and Policy Revision management, immutable Runs and complete Snapshot Submissions. No OIDC or multi-user management.
paths:
  /livez:
    get:
      operationId: getLiveness
      responses:
        '200':
          description: Process is alive; this check has no database dependency
          headers: {X-Trace-ID: {$ref: '#/components/headers/TraceID'}}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /readyz:
    get:
      operationId: getReadiness
      responses:
        '200':
          description: Database is reachable and schema is current
          headers: {X-Trace-ID: {$ref: '#/components/headers/TraceID'}}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Database or schema is unavailable
          headers: {X-Trace-ID: {$ref: '#/components/headers/TraceID'}}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1alpha1/meta/version:
    get:
      operationId: getVersion
      responses:
        '200':
          description: Server build metadata
          headers: {X-Trace-ID: {$ref: '#/components/headers/TraceID'}}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
  /api/v1alpha1/meta/capabilities:
    get:
      operationId: getCapabilities
      responses:
        '200':
          description: Public API, CLI compatibility and feature discovery
          headers: {X-Trace-ID: {$ref: '#/components/headers/TraceID'}}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
        '503':
          description: Runtime capability provider returned an unsupported value
          headers: {X-Trace-ID: {$ref: '#/components/headers/TraceID'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /openapi.yaml:
    get:
      operationId: getOpenAPI
      responses:
        '200':
          description: This OpenAPI document
          headers: {X-Trace-ID: {$ref: '#/components/headers/TraceID'}}
          content:
            application/yaml:
              schema:
                type: string
  /api/v1alpha1/bootstrap:
    get:
      operationId: getBootstrapStatus
      responses:
        '200':
          description: Initialization state; never includes a token
          headers: {X-Trace-ID: {$ref: '#/components/headers/TraceID'}}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapStatus'
        default: {$ref: '#/components/responses/IdentityError'}
    post:
      operationId: bootstrapAdministrator
      description: >
        One-time transaction creating the administrator and default workspace/project, shared by
        the browser setup wizard and CLI. No machine key is created. Repeated initialization returns 409.
        Direct local setup does not require a token only when the actual listener and peer are
        loopback, public_url is unset and no forwarding headers are present. Host, Origin and
        CSRF checks still apply. Other deployments require a BootstrapToken.
        With signIn=true a browser session is created atomically and delivered only via an HttpOnly cookie.
        On an uncertain response, check initialization state before retrying.
      security: [{}, {BootstrapToken: []}]
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BootstrapRequest'}
      responses:
        '201':
          description: Administrator initialized; signIn=true also sets the browser session cookie
          headers: {X-Trace-ID: {$ref: '#/components/headers/TraceID'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BootstrapResult'}
        default: {$ref: '#/components/responses/IdentityError'}
  /api/v1alpha1/auth/api-keys:
    get:
      operationId: listProjectAPIKeys
      description: Lists secret-free key metadata in key-ID order, including expired and revoked keys.
      security: [{AdminSession: []}, {BrowserSession: []}]
      parameters:
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: after, in: query, schema: {type: string}}
      responses:
        '200':
          description: Bounded page; follow nextAfter until absent
          headers: {X-Trace-ID: {$ref: '#/components/headers/TraceID'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/APIKeyPage'}
        default: {$ref: '#/components/responses/IdentityError'}
    post:
      operationId: createProjectAPIKey
      description: >
        Creates a RUN_ORCHESTRATOR or POLICY_PUBLISHER key for the administrator's default project after login.
        Roles expand to fixed effective scopes. RUN_ORCHESTRATOR grants runs:create, runs:read,
        and submission-credential:rotate and may additionally receive runs:create-with-revision.
        POLICY_PUBLISHER grants policies:create and revisions:publish. Callers cannot request arbitrary grants.
        Returns the secret once; only a hash is stored.
        Keys issued by this release persist their complete effective scopes.
        Lifetime defaults to 90 days and must be between 60 seconds and 365 days.
        Expired or revoked keys cannot authenticate. Revocation affects subsequent authentication,
        not operations that already authenticated before it committed.
        Do not automatically retry uncertain requests; each successful request creates a new key.
      security: [{AdminSession: []}, {BrowserSession: []}]
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateAPIKeyRequest'}
      responses:
        '201':
          description: Save the machine secret securely; it cannot be retrieved again
          headers: {X-Trace-ID: {$ref: '#/components/headers/TraceID'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/APIKeyResult'}
        default: {$ref: '#/components/responses/IdentityError'}
  /api/v1alpha1/auth/api-keys/{keyId}:
    delete:
      operationId: revokeProjectAPIKey
      description: Atomically revokes a key and records an audit event. Repeated revocation returns 204.
      security: [{AdminSession: []}, {BrowserSession: []}]
      parameters: [{$ref: '#/components/parameters/APIKeyID'}, {$ref: '#/components/parameters/CSRF'}]
      responses:
        '204':
          description: Key revoked
          headers: {X-Trace-ID: {$ref: '#/components/headers/TraceID'}}
        default: {$ref: '#/components/responses/IdentityError'}
  /api/v1alpha1/auth/api-keys/{keyId}/rotation:
    post:
      operationId: rotateProjectAPIKey
      description: >
        Replaces the secret of an active key atomically, preserving its ID, role and scopes.
        The old secret stops authenticating immediately after commit. expectedVersion must match
        the current metadata, preventing concurrent rotations and exact request retries from
        replacing a newly issued secret. Omitted lifetime preserves the existing expiry.
        Expired or revoked keys cannot rotate. The new secret is returned once; on an uncertain
        response, list keys and inspect the version before deciding how to recover.
      security: [{AdminSession: []}, {BrowserSession: []}]
      parameters: [{$ref: '#/components/parameters/APIKeyID'}, {$ref: '#/components/parameters/CSRF'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RotateAPIKeyRequest'}
      responses:
        '201':
          description: Replacement secret; save it in a new private file
          headers: {X-Trace-ID: {$ref: '#/components/headers/TraceID'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/APIKeyResult'}
        default: {$ref: '#/components/responses/IdentityError'}
  /api/v1alpha1/auth/session:
    post:
      operationId: loginAdministrator
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '201':
          description: >
            Browser login sets og_session (HttpOnly, SameSite=Strict, Secure for HTTPS).
            Only CLI login returns a bearer token. Absolute session lifetime is eight hours.
          headers:
            X-Trace-ID: {$ref: '#/components/headers/TraceID'}
            Set-Cookie: {schema: {type: string}, description: Browser session cookie only}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginResult'}
        default: {$ref: '#/components/responses/IdentityError'}
    delete:
      operationId: logoutAdministrator
      security: [{AdminSession: []}, {BrowserSession: []}]
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      responses:
        '204':
          description: Session revoked and browser cookie cleared
          headers: {X-Trace-ID: {$ref: '#/components/headers/TraceID'}}
        default: {$ref: '#/components/responses/IdentityError'}
  /api/v1alpha1/auth/me:
    get:
      operationId: getCurrentAdministrator
      security: [{AdminSession: []}, {BrowserSession: []}]
      responses:
        '200':
          description: Authenticated administrator, never a machine key
          headers: {X-Trace-ID: {$ref: '#/components/headers/TraceID'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Principal'}
        default: {$ref: '#/components/responses/IdentityError'}
  /api/v1alpha1/auth/password:
    put:
      operationId: changeAdministratorPassword
      security: [{AdminSession: []}, {BrowserSession: []}]
      parameters: [{$ref: '#/components/parameters/CSRF'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordRequest'
      responses:
        '204':
          description: Password changed and all administrator sessions revoked
          headers: {X-Trace-ID: {$ref: '#/components/headers/TraceID'}}
        default: {$ref: '#/components/responses/IdentityError'}
  /runtime/v1alpha1/identity:
    get:
      operationId: getMachineIdentity
      security: [{ProjectKey: []}]
      responses:
        '200':
          description: Authenticated machine identity
          headers: {X-Trace-ID: {$ref: '#/components/headers/TraceID'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Principal'}
        default: {$ref: '#/components/responses/IdentityError'}
  /runtime/v1alpha1/runs:
    get: {"operationId":"listPolicyRuns","description":"Requires runs:read.","parameters":[{"$ref":"#/components/parameters/RunStatusFilter"},{"$ref":"#/components/parameters/RunSceneFilter"},{"$ref":"#/components/parameters/RunLimit"},{"$ref":"#/components/parameters/RunCursor"}],"security":[{"ProjectKey":[]}],"responses":{"default":{"$ref":"#/components/responses/RunError"},"200":{"description":"Success","headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/PolicyRunPage"}}}}}}
    post: {"operationId":"createPolicyRun","security":[{"ProjectKey":[]}],"responses":{"201":{"description":"Success","headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/PolicyRunCreation"}}}},"default":{"$ref":"#/components/responses/RunError"},"200":{"description":"Idempotent replay; credential is not reissued","headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/PolicyRun"}}}}},"description":"Requires runs:create. Creates from the Scene default active Revision. An explicit Revision additionally requires runs:create-with-revision. Same Idempotency-Key replays without reissuing the credential.","parameters":[{"$ref":"#/components/parameters/IdempotencyKey"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/CreatePolicyRunRequest"}}}}}
  /runtime/v1alpha1/runs/{runId}:
    get: {"operationId":"getPolicyRun","description":"Requires runs:read.","security":[{"ProjectKey":[]}],"responses":{"200":{"description":"Success","headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/PolicyRun"}}}},"default":{"$ref":"#/components/responses/RunError"}},"parameters":[{"name":"runId","in":"path","required":true,"schema":{"type":"string"}}]}
  /runtime/v1alpha1/runs/{runId}/submission-credential:rotate:
    post: {"operationId":"rotatePolicySubmissionCredential","description":"Requires submission-credential:rotate.","security":[{"ProjectKey":[]}],"responses":{"201":{"description":"Success","headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/RunSubmissionCredential"}}}},"default":{"$ref":"#/components/responses/RunError"}},"parameters":[{"name":"runId","in":"path","required":true,"schema":{"type":"string"}}]}
  /runtime/v1alpha1/runs/{runId}/submissions:
    post: {"operationId":"submitSnapshot","security":[{"SubmissionCredential":[]}],"responses":{"201":{"description":"Success","headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/SnapshotSubmission"}}}},"default":{"$ref":"#/components/responses/RunError"},"200":{"description":"Idempotent replay of the accepted Submission","headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/SnapshotSubmission"}}}}},"description":"Full Snapshot with baseSubmissionNo CAS. finishRun=false keeps the Run OPEN; finishRun=true freezes Result and Decision. Verdict is derived from Check verdicts.","parameters":[{"name":"runId","in":"path","required":true,"schema":{"type":"string"}},{"$ref":"#/components/parameters/IdempotencyKey"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/SnapshotSubmitRequest"}}}}}
  /api/v1alpha1/runs:
    get: {"operationId":"listManagedPolicyRuns","parameters":[{"$ref":"#/components/parameters/RunStatusFilter"},{"$ref":"#/components/parameters/RunSceneFilter"},{"$ref":"#/components/parameters/RunLimit"},{"$ref":"#/components/parameters/RunCursor"}],"security":[{"AdminSession":[]},{"BrowserSession":[]}],"responses":{"200":{"description":"Success","headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/PolicyRunPage"}}}},"default":{"$ref":"#/components/responses/RunError"}}}
  /api/v1alpha1/runs/{runId}:
    get: {"operationId":"getManagedPolicyRun","security":[{"AdminSession":[]},{"BrowserSession":[]}],"responses":{"200":{"description":"Success","headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/PolicyRun"}}}},"default":{"$ref":"#/components/responses/RunError"}},"parameters":[{"name":"runId","in":"path","required":true,"schema":{"type":"string"}}]}
  /api/v1alpha1/runs/{runId}/submissions:
    get:
      operationId: listManagedRunSubmissions
      description: Administrator-only paginated submission metadata. Fetch evidence through the selected Submission reader.
      security: [{AdminSession: []}, {BrowserSession: []}]
      parameters:
        - {name: runId, in: path, required: true, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
        - {name: before, in: query, schema: {type: integer, format: int64, minimum: 1}}
      responses:
        "200":
          description: Newest-first metadata without evidence payloads
          headers: {X-Trace-ID: {$ref: "#/components/headers/TraceID"}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SubmissionPage"}
        default: {$ref: "#/components/responses/RunError"}
  /api/v1alpha1/runs/{runId}/submissions/{submissionId}:
    get: {"operationId":"getManagedRunSubmission","description":"Read a stored Submission and its evidence within the administrator's workspace, project and selected Run.","security":[{"AdminSession":[]},{"BrowserSession":[]}],"parameters":[{"name":"runId","in":"path","required":true,"schema":{"type":"string"}},{"name":"submissionId","in":"path","required":true,"schema":{"type":"string"}}],"responses":{"200":{"description":"Immutable stored Submission","headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/StoredSubmission"}}}},"default":{"$ref":"#/components/responses/RunError"}}}
  /api/v1alpha1/scenes:
    get: {"operationId":"listSceneModels","security":[{"AdminSession":[]},{"BrowserSession":[]}],"responses":{"200":{"description":"Success","headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/SceneModelList"}}}},"default":{"$ref":"#/components/responses/SpecError"}}}
  /api/v1alpha1/scenes/{key}:initialize:
    post: {"operationId":"initializeScene","security":[{"AdminSession":[]},{"BrowserSession":[]}],"responses":{"201":{"description":"Success","headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/InitializedScene"}}}},"default":{"$ref":"#/components/responses/SpecError"}},"description":"Atomically create Scene, default Policy, Revision 1 and activation. Retry with the same Idempotency-Key.","parameters":[{"name":"key","in":"path","required":true,"schema":{"type":"string"}},{"$ref":"#/components/parameters/CSRF"},{"$ref":"#/components/parameters/IdempotencyKey"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/InitializeSceneRequest"}}}}}
  /api/v1alpha1/scenes/{key}:
    get: {"operationId":"getSceneModel","security":[{"AdminSession":[]},{"BrowserSession":[]}],"responses":{"200":{"description":"Success","headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/SceneModel"}}}},"default":{"$ref":"#/components/responses/SpecError"}},"parameters":[{"name":"key","in":"path","required":true,"schema":{"type":"string"}}]}
    patch: {"operationId":"setSceneTTL","security":[{"AdminSession":[]},{"BrowserSession":[]}],"responses":{"200":{"description":"Success","headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/SceneModel"}}}},"default":{"$ref":"#/components/responses/SpecError"}},"parameters":[{"name":"key","in":"path","required":true,"schema":{"type":"string"}},{"$ref":"#/components/parameters/CSRF"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/SetSceneTTLRequest"}}}}}
  /api/v1alpha1/scenes/{key}/policies:
    get: {"operationId":"listPolicies","security":[{"AdminSession":[]},{"BrowserSession":[]}],"responses":{"200":{"description":"Success","headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/PolicyList"}}}},"default":{"$ref":"#/components/responses/SpecError"}},"parameters":[{"name":"key","in":"path","required":true,"schema":{"type":"string"}}]}
    post: {"operationId":"createPolicy","description":"A Project key requires policies:create, granted by the POLICY_PUBLISHER role.","security":[{"AdminSession":[]},{"BrowserSession":[]},{"ProjectKey":[]}],"responses":{"201":{"description":"Success","headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/Policy"}}}},"default":{"$ref":"#/components/responses/SpecError"}},"parameters":[{"name":"key","in":"path","required":true,"schema":{"type":"string"}},{"$ref":"#/components/parameters/CSRF"},{"$ref":"#/components/parameters/IdempotencyKey"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/CreatePolicyRequest"}}}}}
  /api/v1alpha1/scenes/{key}/bindings:
    get: {"operationId":"listBindings","security":[{"AdminSession":[]},{"BrowserSession":[]}],"parameters":[{"name":"key","in":"path","required":true,"schema":{"type":"string"}},{"name":"limit","in":"query","schema":{"type":"integer","minimum":1,"maximum":100,"default":20}},{"name":"after","in":"query","schema":{"type":"string","maxLength":1366}}],"responses":{"200":{"description":"Success","content":{"application/json":{"schema":{"$ref":"#/components/schemas/BindingPage"}}},"headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}}},"default":{"$ref":"#/components/responses/SpecError"}}}
  /api/v1alpha1/scenes/{key}/bindings/{kind}/{resourceId}:
    put: {"operationId":"putBinding","security":[{"AdminSession":[]},{"BrowserSession":[]}],"parameters":[{"name":"key","in":"path","required":true,"schema":{"type":"string"}},{"name":"kind","in":"path","required":true,"schema":{"type":"string"}},{"name":"resourceId","in":"path","required":true,"schema":{"type":"string"}},{"$ref":"#/components/parameters/CSRF"}],"description":"Idempotently create or replace a resource binding within this scene. Omit policyRevisionId to follow the Policy active revision. Resource IDs containing slash must be URL-encoded.","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/PutBindingRequest"}}}},"responses":{"200":{"description":"Success","content":{"application/json":{"schema":{"$ref":"#/components/schemas/PolicyBinding"}}},"headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}}},"default":{"$ref":"#/components/responses/SpecError"}}}
    delete: {"operationId":"deleteBinding","security":[{"AdminSession":[]},{"BrowserSession":[]}],"parameters":[{"name":"key","in":"path","required":true,"schema":{"type":"string"}},{"name":"kind","in":"path","required":true,"schema":{"type":"string"}},{"name":"resourceId","in":"path","required":true,"schema":{"type":"string"}},{"$ref":"#/components/parameters/CSRF"}],"responses":{"204":{"description":"Binding absent; repeated deletion also succeeds","headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}}},"default":{"$ref":"#/components/responses/SpecError"}}}
  /api/v1alpha1/scenes/{key}/default-policy:
    put: {"operationId":"setDefaultPolicy","security":[{"AdminSession":[]},{"BrowserSession":[]}],"responses":{"200":{"description":"Success","headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/SceneModel"}}}},"default":{"$ref":"#/components/responses/SpecError"}},"parameters":[{"name":"key","in":"path","required":true,"schema":{"type":"string"}},{"$ref":"#/components/parameters/CSRF"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/SetDefaultPolicyRequest"}}}}}
  /api/v1alpha1/policies/{policyId}:
    get: {"operationId":"getPolicy","security":[{"AdminSession":[]},{"BrowserSession":[]}],"responses":{"200":{"description":"Success","headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/Policy"}}}},"default":{"$ref":"#/components/responses/SpecError"}},"parameters":[{"name":"policyId","in":"path","required":true,"schema":{"type":"string"}}]}
  /api/v1alpha1/policies/{policyId}/draft:
    put: {"operationId":"savePolicyDraft","security":[{"AdminSession":[]},{"BrowserSession":[]}],"responses":{"200":{"description":"Success","headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/PolicyRevision"}}}},"default":{"$ref":"#/components/responses/SpecError"}},"parameters":[{"name":"policyId","in":"path","required":true,"schema":{"type":"string"}},{"$ref":"#/components/parameters/CSRF"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/PolicyDraftRequest"}}}}}
    get: {"operationId":"getPolicyDraft","security":[{"AdminSession":[]},{"BrowserSession":[]}],"parameters":[{"name":"policyId","in":"path","required":true,"schema":{"type":"string"}}],"description":"Return the current DRAFT Revision, or NOT_FOUND when no draft exists.","responses":{"200":{"description":"Draft Revision","headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/PolicyRevision"}}}},"default":{"$ref":"#/components/responses/SpecError"}}}
  /api/v1alpha1/policies/{policyId}/draft:publish:
    post: {"operationId":"publishPolicyDraft","security":[{"AdminSession":[]},{"BrowserSession":[]}],"responses":{"201":{"description":"Success","headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/PolicyRevision"}}}},"default":{"$ref":"#/components/responses/SpecError"}},"parameters":[{"name":"policyId","in":"path","required":true,"schema":{"type":"string"}},{"$ref":"#/components/parameters/CSRF"},{"$ref":"#/components/parameters/IdempotencyKey"}],"description":"Publish only the exact Draft YAML reviewed by the caller. The required yaml must match the stored Draft under its lock; otherwise return RESOURCE_STATE_CONFLICT. Retry the same Idempotency-Key with the same yaml.","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/PolicyDraftRequest"}}}}}
  /api/v1alpha1/policies/{policyId}/revisions:
    get: {"operationId":"listPolicyRevisions","security":[{"AdminSession":[]},{"BrowserSession":[]}],"responses":{"200":{"description":"Success","headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/PolicyRevisionPage"}}}},"default":{"$ref":"#/components/responses/SpecError"}},"parameters":[{"name":"policyId","in":"path","required":true,"schema":{"type":"string"}},{"name":"pageSize","in":"query","schema":{"type":"integer","minimum":1,"maximum":100,"default":20}},{"name":"before","in":"query","schema":{"type":"integer","format":"int64","minimum":1}}],"description":"Returns a bounded page of summaries without YAML. Fetch content by revision ID. before is the exclusive revision-number cursor; new publications do not shift older pages."}
    post: {"operationId":"publishPolicyRevision","description":"A Project key requires revisions:publish, granted by the POLICY_PUBLISHER role; publication does not change Draft or active Revision.","security":[{"AdminSession":[]},{"BrowserSession":[]},{"ProjectKey":[]}],"responses":{"201":{"description":"Success","headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/PolicyRevision"}}}},"default":{"$ref":"#/components/responses/SpecError"}},"parameters":[{"name":"policyId","in":"path","required":true,"schema":{"type":"string"}},{"$ref":"#/components/parameters/CSRF"},{"$ref":"#/components/parameters/IdempotencyKey"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/PublishPolicyRevisionRequest"}}}}}
  /api/v1alpha1/policies/{policyId}/active-revision:
    put: {"operationId":"activatePolicyRevision","security":[{"AdminSession":[]},{"BrowserSession":[]}],"responses":{"200":{"description":"Success","headers":{"X-Trace-ID":{"$ref":"#/components/headers/TraceID"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/Policy"}}}},"default":{"$ref":"#/components/responses/SpecError"}},"parameters":[{"name":"policyId","in":"path","required":true,"schema":{"type":"string"}},{"$ref":"#/components/parameters/CSRF"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ActivatePolicyRevisionRequest"}}}}}
  /api/v1alpha1/policies/{policyId}:archive:
