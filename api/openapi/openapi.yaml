components:
  headers:
    TraceID:
      description: Opaque request correlation identifier generated by the server; safe to include in support reports
      required: true
      schema: {type: string, pattern: '^[a-f0-9]{32}$'}
  securitySchemes:
    BootstrapToken: {type: http, scheme: bearer, description: One-time host-issued bootstrap token; expires after one hour}
    AdminSession: {type: http, scheme: bearer, description: CLI administrator session; not a Project key}
    BrowserSession: {type: apiKey, in: cookie, name: og_session}
    ProjectKey: {type: http, scheme: bearer, description: Project-scoped machine key; each operation checks its required permission}
    SubmissionCredential: {type: http, scheme: bearer, description: Run-scoped credential accepted only by that Run's Submission endpoint}
  parameters:
    APIKeyID:
      name: keyId
      in: path
      required: true
      schema: {type: string, pattern: '^key_[a-zA-Z0-9]{32,64}$'}
    SceneKey:
      name: key
      in: path
      required: true
      schema: {$ref: '#/components/schemas/SceneKey'}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        pattern: '^[a-zA-Z0-9][a-zA-Z0-9._:-]{0,127}$'
      description: Stable caller operation ID; scoped to the authenticated Project and not a credential or Run ID
    RunStatusFilter:
      name: status
      in: query
      schema: {$ref: '#/components/schemas/RunStatus'}
      description: Optional effective Run status. Overdue OPEN Runs match EXPIRED rather than OPEN.
    RunSceneFilter:
      name: sceneKey
      in: query
      schema: {$ref: '#/components/schemas/SceneKey'}
      description: Optional exact Scene key.
    RunLimit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      description: Maximum number of Runs returned.
    RunCursor:
      name: cursor
      in: query
      schema: {type: string, minLength: 1, maxLength: 512}
      description: Opaque cursor returned by the preceding page. Do not inspect or construct it.
    CSRF:
      name: X-Guardrail-CSRF
      in: header
      required: true
      schema: {type: string, enum: ['1']}
      description: >
        Required for all management mutations. Browser requests must also pass exact
        Origin/Host and Sec-Fetch-Site checks. No cross-origin CORS is enabled.
  responses:
    RunError:
      description: >
        400 INVALID_ARGUMENT; 401 UNAUTHENTICATED; 403 PERMISSION_DENIED; 404 NOT_FOUND;
        409 SPEC_NOT_PUBLISHED, BINDING_CONFLICT, IDEMPOTENCY_CONFLICT, RUN_FINISHED or BASE_SUBMISSION_MISMATCH; 410 RUN_EXPIRED;
        422 INVALID_SUBMISSION, VERDICT_MISMATCH or SENSITIVE_EVIDENCE_DETECTED; 503 RUN_UNAVAILABLE.
        Cross-Project reads return 404. Runtime operations use Project or Run credentials;
        read-only management Run operations use the authenticated administrator session.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
      headers: {X-Trace-ID: {$ref: '#/components/headers/TraceID'}}
    SpecError:
      description: >
        400 INVALID_ARGUMENT; 401 UNAUTHENTICATED; 403 PERMISSION_DENIED, UNTRUSTED_ORIGIN or CSRF_REQUIRED;
        404 NOT_FOUND; 409 RESOURCE_STATE_CONFLICT or SCENE_ALREADY_INITIALIZED; 422 SPEC_VALIDATION_FAILED with safe validation guidance;
        503 SPEC_UNAVAILABLE or IDENTITY_UNAVAILABLE.
        Scene mutations require X-Guardrail-CSRF and exact Host/Origin checks.
        Copy unsaved edits before reloading after a conflict.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
      headers: {X-Trace-ID: {$ref: '#/components/headers/TraceID'}}
    IdentityError:
      description: >
        400 INVALID_ARGUMENT; 401 UNAUTHENTICATED; 403 UNTRUSTED_ORIGIN or CSRF_REQUIRED;
        409 ALREADY_INITIALIZED;
        429 RATE_LIMITED for temporary login backoff, with Retry-After in seconds;
        503 IDENTITY_UNAVAILABLE. Raw errors and credential values are never returned.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
      headers:
        X-Trace-ID: {$ref: '#/components/headers/TraceID'}
        Retry-After:
          description: Conservative retry delay in seconds, present for RATE_LIMITED.
          schema: {type: integer, minimum: 1}
  schemas:
    AuditEvent: {"type":"object","additionalProperties":false,"required":["id","eventType","occurredAt"],"properties":{"id":{"type":"string"},"eventType":{"type":"string"},"actorId":{"type":"string"},"actorRef":{"type":"string"},"occurredAt":{"type":"integer","format":"int64"},"resourceType":{"type":"string"},"resourceId":{"type":"string"},"resourceRef":{"type":"string"},"details":{"type":"object","additionalProperties":true,"x-go-type":"json.RawMessage"},"detailsDigest":{"type":"string"},"detailsUnavailable":{"type":"boolean"}}}
    AuditPage: {"type":"object","additionalProperties":false,"required":["items","redacted"],"properties":{"items":{"type":"array","items":{"$ref":"#/components/schemas/AuditEvent"}},"nextCursor":{"type":"string"},"redacted":{"type":"boolean"}}}
    RunReportEvidence: {"type":"object","additionalProperties":false,"required":["requirementId","observedAt","queryDigest","resultDigest"],"properties":{"requirementId":{"type":"string"},"observedAt":{"type":"string"},"queryDigest":{"type":"string"},"resultDigest":{"type":"string"},"referenceDigest":{"type":"string"}}}
    RunReportCheck: {"type":"object","additionalProperties":false,"required":["checkId","verdict","evidence"],"properties":{"checkId":{"type":"string"},"verdict":{"$ref":"#/components/schemas/RunResult"},"evidence":{"type":"array","items":{"$ref":"#/components/schemas/RunReportEvidence"}}}}
    RunReportSubmission: {"type":"object","additionalProperties":false,"required":["id","submissionNo","verdict","finishRun","createdAt"],"properties":{"id":{"type":"string"},"submissionNo":{"type":"integer","format":"int64"},"verdict":{"$ref":"#/components/schemas/RunResult"},"finishRun":{"type":"boolean"},"createdAt":{"type":"integer","format":"int64"},"snapshotDigest":{"type":"string"},"checks":{"type":"array","items":{"$ref":"#/components/schemas/RunReportCheck"}}}}
    RunReportRevision: {"type":"object","additionalProperties":false,"required":["id","policyId","digest"],"properties":{"id":{"type":"string"},"policyId":{"type":"string"},"digest":{"type":"string"},"revisionNumber":{"type":"integer","format":"int64"},"publishedAt":{"type":"integer","format":"int64"}}}
    RunReport: {"type":"object","additionalProperties":false,"required":["format","generatedAt","run","revision","reasons","submissions"],"properties":{"format":{"type":"string"},"generatedAt":{"type":"integer","format":"int64"},"run":{"$ref":"#/components/schemas/PolicyRunSummary"},"revision":{"$ref":"#/components/schemas/RunReportRevision"},"reasons":{"type":"array","items":{"type":"string"}},"submissions":{"type":"array","items":{"$ref":"#/components/schemas/RunReportSubmission"}},"nextBefore":{"type":"integer","format":"int64"},"finalSubmission":{"$ref":"#/components/schemas/RunReportSubmission"}}}
    RunSelection: {"type":"object","additionalProperties":false,"required":["source"],"description":"Optional frozen selection details beyond the Policy and final Revision IDs on the Run. New Runs record matched resource bindings only; default and explicit-Revision selection omit this field. Existing evidence or its absence stays unchanged. Resources contain only the matched group.","properties":{"source":{"type":"string","enum":["binding"]},"resources":{"type":"array","maxItems":100,"items":{"$ref":"#/components/schemas/ResourceReference"}},"revisionMode":{"type":"string","enum":["active","pinned"],"description":"Present only for binding selections; explains the binding at Run creation."}}}
    BindingPage: {"type":"object","additionalProperties":false,"required":["items"],"properties":{"items":{"type":"array","items":{"$ref":"#/components/schemas/PolicyBinding"}},"nextAfter":{"type":"string"}}}
    PolicyBinding: {"type":"object","additionalProperties":false,"required":["resource","policyId"],"properties":{"resource":{"$ref":"#/components/schemas/ResourceReference"},"policyId":{"type":"string"},"policyRevisionId":{"type":"string"}}}
    PutBindingRequest: {"type":"object","additionalProperties":false,"required":["policyId"],"properties":{"policyId":{"type":"string"},"policyRevisionId":{"type":"string"}}}
    ResourceReference: {"type":"object","additionalProperties":false,"required":["kind","id"],"properties":{"kind":{"type":"string","pattern":"^[a-z][a-z0-9-]{0,63}$"},"id":{"type":"string","minLength":1,"maxLength":128}}}
    SceneModel: {"type":"object","additionalProperties":false,"required":["key","name","runTtlSeconds"],"properties":{"key":{"$ref":"#/components/schemas/SceneKey"},"name":{"type":"string"},"runTtlSeconds":{"type":"integer","format":"int64"},"defaultPolicyId":{"type":"string"}}}
    SceneModelList: {"type":"array","items":{"$ref":"#/components/schemas/SceneModel"}}
    Policy: {"type":"object","additionalProperties":false,"required":["id","sceneKey","name","lifecycleState"],"properties":{"id":{"type":"string"},"sceneKey":{"$ref":"#/components/schemas/SceneKey"},"name":{"type":"string"},"lifecycleState":{"type":"string","enum":["ACTIVE","ARCHIVED"]},"activeRevisionId":{"type":"string"}}}
    PolicyList: {"type":"array","items":{"$ref":"#/components/schemas/Policy"}}
    PolicyRevision: {"type":"object","additionalProperties":false,"required":["id","policyId","status","yaml","updatedBy","updatedAt"],"properties":{"id":{"type":"string"},"policyId":{"type":"string"},"revisionNumber":{"type":"integer","format":"int64","description":"Present only for PUBLISHED Revisions."},"yaml":{"type":"string"},"digest":{"type":"string","description":"Present only for PUBLISHED Revisions."},"publishedAt":{"type":"integer","format":"int64","description":"Present only for PUBLISHED Revisions."},"publishedBy":{"type":"string","description":"Present only for PUBLISHED Revisions."},"status":{"type":"string","enum":["DRAFT","PUBLISHED"]},"updatedBy":{"type":"string"},"updatedAt":{"type":"integer","format":"int64"}}}
    InitializedScene: {"type":"object","additionalProperties":false,"required":["scene","policy","revision"],"properties":{"scene":{"$ref":"#/components/schemas/SceneModel"},"policy":{"$ref":"#/components/schemas/Policy"},"revision":{"$ref":"#/components/schemas/PolicyRevision"}}}
    InitializeSceneRequest: {"type":"object","additionalProperties":false,"required":["name","defaultPolicyName","yaml"],"properties":{"name":{"type":"string"},"defaultPolicyName":{"type":"string"},"yaml":{"type":"string"}}}
    SetSceneTTLRequest: {"type":"object","additionalProperties":false,"required":["runTtlSeconds"],"properties":{"runTtlSeconds":{"type":"integer","format":"int64"}}}
    CreatePolicyRequest: {"type":"object","additionalProperties":false,"required":["name"],"properties":{"name":{"type":"string"}}}
    SetDefaultPolicyRequest: {"type":"object","additionalProperties":false,"required":["policyId","expectedDefaultPolicyId"],"properties":{"policyId":{"type":"string"},"expectedDefaultPolicyId":{"type":"string","nullable":true}}}
    PolicyDraftRequest: {"type":"object","additionalProperties":false,"required":["yaml"],"properties":{"yaml":{"type":"string"}}}
    PublishPolicyRevisionRequest: {"type":"object","additionalProperties":false,"required":["yaml"],"properties":{"yaml":{"type":"string"}}}
    ActivatePolicyRevisionRequest: {"type":"object","additionalProperties":false,"required":["policyRevisionId","expectedActiveRevisionId"],"properties":{"policyRevisionId":{"type":"string"},"expectedActiveRevisionId":{"type":"string","nullable":true}}}
    CreatePolicyRunRequest: {"type":"object","additionalProperties":false,"required":["sceneKey","changeSet"],"properties":{"sceneKey":{"$ref":"#/components/schemas/SceneKey"},"changeSet":{"type":"object","additionalProperties":true,"x-go-type":"json.RawMessage"},"policyRevisionRef":{"type":"object","additionalProperties":false,"required":["policyRevisionId"],"properties":{"policyRevisionId":{"type":"string"}},"description":"Privileged override requiring runs:create-with-revision and bypassing resource bindings. Grant only to trusted override operators."},"resources":{"type":"array","minItems":1,"maxItems":100,"items":{"$ref":"#/components/schemas/ResourceReference"},"description":"Selection input supplied by a trusted integration, not verified business ownership. Omission or entirely unbound resources selects the scene default. Rejected with policyRevisionRef."}}}
    PolicyRun: {"type":"object","additionalProperties":false,"required":["id","sceneKey","policyId","policyRevisionId","specDigest","status","changeSet","changeSetDigest","runTtlSeconds","deadlineAt","latestSubmissionNo","createdAt"],"properties":{"id":{"type":"string"},"sceneKey":{"$ref":"#/components/schemas/SceneKey"},"policyId":{"type":"string"},"policyRevisionId":{"type":"string"},"specDigest":{"type":"string"},"status":{"type":"string","enum":["OPEN","FINISHED","EXPIRED"]},"changeSet":{"type":"object","additionalProperties":true,"x-go-type":"json.RawMessage"},"changeSetDigest":{"type":"string"},"runTtlSeconds":{"type":"integer","format":"int64"},"deadlineAt":{"type":"integer","format":"int64"},"latestSubmissionNo":{"type":"integer","format":"int64"},"finalSubmissionId":{"type":"string"},"createdAt":{"type":"integer","format":"int64"},"finishedAt":{"type":"integer","format":"int64"},"expiredAt":{"type":"integer","format":"int64"},"result":{"$ref":"#/components/schemas/RunResult"},"decision":{"$ref":"#/components/schemas/Decision"},"decisionExpiresAt":{"type":"integer","format":"int64"},"selection":{"$ref":"#/components/schemas/RunSelection"}}}
    PolicyRunSummary: {"type":"object","description":"Bounded Run list item. Read the Run detail endpoint for changeSet.","additionalProperties":false,"required":["id","sceneKey","policyId","policyRevisionId","specDigest","status","changeSetDigest","runTtlSeconds","deadlineAt","latestSubmissionNo","createdAt"],"properties":{"id":{"type":"string"},"sceneKey":{"$ref":"#/components/schemas/SceneKey"},"policyId":{"type":"string"},"policyRevisionId":{"type":"string"},"specDigest":{"type":"string"},"status":{"type":"string","enum":["OPEN","FINISHED","EXPIRED"]},"changeSetDigest":{"type":"string"},"runTtlSeconds":{"type":"integer","format":"int64"},"deadlineAt":{"type":"integer","format":"int64"},"latestSubmissionNo":{"type":"integer","format":"int64"},"finalSubmissionId":{"type":"string"},"createdAt":{"type":"integer","format":"int64"},"finishedAt":{"type":"integer","format":"int64"},"expiredAt":{"type":"integer","format":"int64"},"result":{"$ref":"#/components/schemas/RunResult"},"decision":{"$ref":"#/components/schemas/Decision"},"decisionExpiresAt":{"type":"integer","format":"int64"}}}
    SnapshotSubmitRequest: {"type":"object","additionalProperties":false,"required":["baseSubmissionNo","finishRun","verdict","summary","checks"],"properties":{"baseSubmissionNo":{"type":"integer","format":"int64"},"finishRun":{"type":"boolean"},"verdict":{"$ref":"#/components/schemas/RunResult"},"summary":{"type":"string"},"checks":{"type":"array","items":{"$ref":"#/components/schemas/SnapshotCheck"}}}}
    SnapshotCheck: {"type":"object","additionalProperties":false,"required":["checkId","verdict","summary","evidence"],"properties":{"checkId":{"type":"string"},"verdict":{"$ref":"#/components/schemas/RunResult"},"summary":{"type":"string"},"evidence":{"type":"array","items":{"$ref":"#/components/schemas/SnapshotEvidence"}}}}
    SnapshotEvidence: {"type":"object","additionalProperties":false,"required":["requirementId","observedAt","querySummary","resultSummary"],"properties":{"requirementId":{"type":"string"},"observedAt":{"type":"string","format":"date-time"},"querySummary":{"type":"string"},"resultSummary":{"type":"string"},"reference":{"type":"string"}}}
    StoredSubmission: {"type":"object","additionalProperties":false,"required":["id","runId","submissionNo","baseSubmissionNo","verdict","summary","finishRun","createdAt","snapshot"],"properties":{"id":{"type":"string"},"runId":{"type":"string"},"submissionNo":{"type":"integer","format":"int64"},"baseSubmissionNo":{"type":"integer","format":"int64"},"verdict":{"$ref":"#/components/schemas/RunResult"},"summary":{"type":"string"},"finishRun":{"type":"boolean"},"createdAt":{"type":"integer","format":"int64"},"snapshot":{"$ref":"#/components/schemas/SnapshotSubmitRequest"}}}
    SnapshotSubmission: {"type":"object","additionalProperties":false,"required":["id","runId","submissionNo","baseSubmissionNo","verdict","summary","finishRun","createdAt"],"properties":{"id":{"type":"string"},"runId":{"type":"string"},"submissionNo":{"type":"integer","format":"int64"},"baseSubmissionNo":{"type":"integer","format":"int64"},"verdict":{"$ref":"#/components/schemas/RunResult"},"summary":{"type":"string"},"finishRun":{"type":"boolean"},"createdAt":{"type":"integer","format":"int64"}}}
    PolicyRunCreation: {"type":"object","additionalProperties":false,"required":["run","submissionCredential"],"properties":{"run":{"$ref":"#/components/schemas/PolicyRun"},"submissionCredential":{"$ref":"#/components/schemas/RunSubmissionCredential"}}}
    PolicyRunPage: {"type":"object","additionalProperties":false,"required":["items"],"properties":{"items":{"type":"array","items":{"$ref":"#/components/schemas/PolicyRunSummary"}},"nextCursor":{"type":"string"}}}
    SubmissionPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, maxItems: 50, items: {$ref: "#/components/schemas/SnapshotSubmission"}}
        nextBefore: {type: integer, format: int64, minimum: 1}
    RunSubmissionCredential:
      type: object
      additionalProperties: false
      required: [runId, token, expiresAt]
      properties:
        runId: {type: string}
        token: {type: string, description: Plaintext returned only on creation or rotation}
        expiresAt: {type: integer, format: int64}
    RunResult: {type: string, enum: [PASS, BLOCKED, UNKNOWN]}
    Decision: {type: string, enum: [ALLOW, DENY]}
    RunStatus: {type: string, enum: [OPEN, FINISHED, EXPIRED]}
    SceneKey: {type: string, pattern: '^[a-zA-Z0-9][a-zA-Z0-9_.-]{0,63}$'}
    GuardrailSpec:
      type: object
      additionalProperties: false
      description: >
        Schema for YAML content at publication. validForSeconds is an integer from 1 to 9007199254740991;
        all other scalars are strings. Run timeout is not part of this YAML.
        One YAML document, at most 64 KiB, 4096 nodes and nesting depth 16.
        Duplicate keys, anchors, aliases, custom tags, unknown fields and implicit scalar coercions are rejected.
        Canonicalization uses RFC 8785 rules for this fixed schema. The numeric range is
        restricted to IEEE 754 safe integers; out-of-range values are rejected without rounding.
      required: [apiVersion, kind, metadata, spec]
      properties:
        apiVersion: {type: string, enum: [guardrail.open/v1alpha1]}
        kind: {type: string, enum: [GuardrailSpec]}
        metadata:
          type: object
          additionalProperties: false
          required: [name]
          properties:
            name: {$ref: '#/components/schemas/SpecIdentifier'}
        spec:
          type: object
          additionalProperties: false
          required: [description, instructions, checks]
          properties:
            description: {type: string, minLength: 1, maxLength: 1024, description: Overall purpose of this Spec; must not be whitespace-only}
            instructions: {type: string, minLength: 1, maxLength: 8000, description: Overall instructions for the evaluator; must not be whitespace-only}
            validForSeconds: {type: integer, format: int64, minimum: 1, maximum: 9007199254740991, default: 3600, description: Accepted result validity in seconds; omitted values use 3600. Values above the IEEE 754 safe-integer maximum are rejected without rounding}
            checks:
              type: array
              minItems: 1
              maxItems: 20
              description: Check IDs must be unique within the Spec
              items:
                type: object
                additionalProperties: false
                required: [id, displayName, description, instructions, criteria, evidenceRequirements]
                properties:
                  id: {$ref: '#/components/schemas/SpecIdentifier'}
                  displayName: {type: string, minLength: 1, maxLength: 128, description: Human-readable check name}
                  description: {type: string, minLength: 1, maxLength: 1024, description: Must not be whitespace-only}
                  instructions: {type: string, minLength: 1, maxLength: 8000, description: Must not be whitespace-only}
                  criteria:
                    type: object
                    additionalProperties: false
                    required: [pass, block, unknown]
                    description: Verdict-specific criteria
                    properties:
                      pass: {type: string, minLength: 1, maxLength: 2048}
                      block: {type: string, minLength: 1, maxLength: 2048}
                      unknown: {type: string, minLength: 1, maxLength: 2048}
                  evidenceRequirements:
                    type: array
                    minItems: 1
                    maxItems: 20
                    description: Evidence IDs must be unique within this check
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, description, appliesToVerdicts]
                      properties:
                        id: {$ref: '#/components/schemas/SpecIdentifier'}
                        description: {type: string, minLength: 1, maxLength: 1024, description: Evidence purpose}
                        appliesToVerdicts:
                          type: array
                          description: Verdicts requiring this evidence
                          minItems: 1
                          maxItems: 3
                          uniqueItems: true
                          items: {type: string, enum: [PASS, BLOCKED, UNKNOWN]}
    SpecIdentifier:
      type: string
      pattern: '^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$'
    User:
      type: object
      additionalProperties: false
      required: [id, username, workspaceId, projectId]
      properties:
        id: {type: string}
        username: {type: string}
        workspaceId: {type: string}
        projectId: {type: string}
    Principal:
      type: object
      additionalProperties: false
      required: [kind, workspaceId, projectId, role, scopes]
      properties:
        kind: {type: string, enum: [admin, api_key]}
        role: {type: string, enum: [ADMIN, RUN_ORCHESTRATOR, POLICY_PUBLISHER], x-enum-varnames: [Admin, RunOrchestrator, PolicyPublisher]}
        workspaceId: {type: string}
        projectId: {type: string}
        scopes:
          type: array
          uniqueItems: true
          description: Complete persisted machine permissions used for authorization.
          items: {$ref: '#/components/schemas/MachineScope'}
        user: {$ref: '#/components/schemas/User'}
    BootstrapRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
