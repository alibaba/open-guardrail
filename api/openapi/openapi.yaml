    GuardrailSpec:
      type: object
      additionalProperties: false
      description: >
        Schema for YAML content at publication. validForSeconds is an integer from 1 to 9007199254740991;
        all other scalars are strings. Run timeout is not part of this YAML.
        One YAML document, at most 64 KiB, 4096 nodes and nesting depth 16.
        Duplicate keys, anchors, aliases, custom tags, unknown fields and implicit scalar coercions are rejected.
        Canonicalization uses RFC 8785 rules for this fixed schema. The numeric range is
        restricted to IEEE 754 safe integers; out-of-range values are rejected without rounding.
      required: [apiVersion, kind, metadata, spec]
      properties:
        apiVersion: {type: string, enum: [guardrail.open/v1alpha1]}
        kind: {type: string, enum: [GuardrailSpec]}
        metadata:
          type: object
          additionalProperties: false
          required: [name]
          properties:
            name: {$ref: '#/components/schemas/SpecIdentifier'}
        spec:
          type: object
          additionalProperties: false
          required: [description, instructions, checks]
          properties:
            description: {type: string, minLength: 1, maxLength: 1024, description: Overall purpose of this Spec; must not be whitespace-only}
            instructions: {type: string, minLength: 1, maxLength: 8000, description: Overall instructions for the evaluator; must not be whitespace-only}
            validForSeconds: {type: integer, format: int64, minimum: 1, maximum: 9007199254740991, default: 3600, description: Accepted result validity in seconds; omitted values use 3600. Values above the IEEE 754 safe-integer maximum are rejected without rounding}
            checks:
              type: array
              minItems: 1
              maxItems: 20
              description: Check IDs must be unique within the Spec
              items:
                type: object
                additionalProperties: false
                required: [id, displayName, description, instructions, criteria, evidenceRequirements]
                properties:
                  id: {$ref: '#/components/schemas/SpecIdentifier'}
                  displayName: {type: string, minLength: 1, maxLength: 128, description: Human-readable check name}
                  description: {type: string, minLength: 1, maxLength: 1024, description: Must not be whitespace-only}
                  instructions: {type: string, minLength: 1, maxLength: 8000, description: Must not be whitespace-only}
                  criteria:
                    type: object
                    additionalProperties: false
                    required: [pass, block, unknown]
                    description: Verdict-specific criteria
                    properties:
                      pass: {type: string, minLength: 1, maxLength: 2048}
                      block: {type: string, minLength: 1, maxLength: 2048}
                      unknown: {type: string, minLength: 1, maxLength: 2048}
                  evidenceRequirements:
                    type: array
                    minItems: 1
                    maxItems: 20
                    description: Evidence IDs must be unique within this check
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, description, appliesToVerdicts]
                      properties:
                        id: {$ref: '#/components/schemas/SpecIdentifier'}
                        description: {type: string, minLength: 1, maxLength: 1024, description: Evidence purpose}
                        appliesToVerdicts:
                          type: array
                          description: Verdicts requiring this evidence
                          minItems: 1
                          maxItems: 3
                          uniqueItems: true
                          items: {type: string, enum: [PASS, BLOCKED, UNKNOWN]}
    SpecIdentifier:
      type: string
      pattern: '^[a-z]([a-z0-9-]{0,126}[a-z0-9])?$'
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [alive, ready]
    Version:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version:
          type: string
    Capabilities:
      type: object
      additionalProperties: false
      required: [apiVersions, cli, features, storage]
      properties:
        apiVersions:
          type: array
          minItems: 1
          items: {type: string}
        cli:
          $ref: '#/components/schemas/CLICompatibility'
        features:
          type: array
          description: Enabled HTTP features. run-final-submission-decision covers one immutable final Submission and fixed PASS/ALLOW, BLOCKED/DENY or UNKNOWN/DENY evaluation. run-expiry-decision-validity covers frozen deadlines, lazy expiration and Decision expiry timestamps. run-scoped-submission-token covers one-time Run credentials and rotation through the direct-access management API. No feature implies Claims.
          items: {type: string}
        storage:
          $ref: '#/components/schemas/StorageCapability'
    StorageCapability:
      type: object
      description: Non-sensitive operating envelope of the active storage adapter
      additionalProperties: false
      required: [supportLevel, multiInstance]
      properties:
        supportLevel:
          type: string
          enum: [official-local, official-shared]
        multiInstance:
          type: boolean
          description: Whether this release supports multiple service instances sharing the active database
    CLICompatibility:
      type: object
      description: CLI protocol compatibility window; independent of the running server build version
      additionalProperties: false
      required: [minimumVersion, maximumVersionExclusive]
      properties:
        minimumVersion: {type: string, description: Oldest compatible CLI version, inclusive}
        maximumVersionExclusive: {type: string, description: First incompatible CLI version, exclusive}
    Error:
      type: object
      additionalProperties: false
      required: [code, message, traceId]
      properties:
        code:
          type: string
        message:
          type: string
        traceId:
          type: string
          pattern: '^[a-f0-9]{32}$'
          description: Same value as the X-Trace-ID response header
