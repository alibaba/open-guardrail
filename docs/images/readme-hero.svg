<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">OpenGuardrail: evidence before action</title>
  <desc id="hero-desc">An AI agent runs checks with its tools and submits results and evidence to OpenGuardrail. OpenGuardrail freezes the policy revision, validates the submission and records an ALLOW or DENY decision with a validity window and audit trail. The execution tool verifies the decision and evidence before acting on the real system.</desc>
  <defs>
    <linearGradient id="product" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1f8ff"/><stop offset="1" stop-color="#fbfdff"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#268cf3"/><stop offset="1" stop-color="#155cc0"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 5 L0 10 Z" fill="#294760"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #17324d; }
      .muted { fill: #64778d; }
      .blue { fill: #155db8; }
      .green { fill: #0f766e; }
      .red { fill: #b42318; }
      .card { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.6; }
      .product { fill: url(#product); stroke: #89b6e9; stroke-width: 1.8; }
      .label { font-size: 12px; font-weight: 700; letter-spacing: 1.2px; }
      .icon { fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1600" height="620" fill="#ffffff"/>

  <!-- Header -->
  <path d="M52 38 L72 46 V64 C72 78 61 87 52 91 C43 87 32 78 32 64 V46 Z" fill="url(#brand)"/>
  <path d="M42 64 L49 71 L63 54" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="86" y="62" font-size="30" font-weight="800" letter-spacing="-0.6">Evidence before action.</text>
  <text x="86" y="92" font-size="18" class="muted">Evidence and decisions for actions routed through a guarded tool.</text>
  <rect x="1268" y="40" width="284" height="34" rx="17" fill="#eef6ff" stroke="#c7def8"/>
  <text x="1410" y="62" text-anchor="middle" font-size="14" font-weight="600" class="blue">policy · evidence · decision</text>

  <!-- Left: agent -->
  <rect x="48" y="150" width="376" height="330" rx="14" class="card"/>
  <circle cx="88" cy="190" r="22" fill="#e8eef5"/>
  <g transform="translate(88 190)" class="icon" color="#294760">
    <rect x="-13" y="-9" width="26" height="21" rx="5"/>
    <path d="M0 -9 V-16 M-13 -3 H-18 V6 H-13 M13 -3 H18 V6 H13 M-7 12 L-9 17 H9 L7 12 M-4 5 H4"/>
    <circle cx="-5" cy="1" r="1.6" fill="#294760" stroke="none"/><circle cx="5" cy="1" r="1.6" fill="#294760" stroke="none"/>
  </g>
  <text x="126" y="196" font-size="22" font-weight="700">AI agent / automation</text>
  <text x="126" y="222" font-size="15" class="muted">Claude Code · Cursor · CI · scripts</text>
  <line x1="76" y1="248" x2="396" y2="248" stroke="#e2e8f0"/>
  <g font-size="16">
    <circle cx="84" cy="284" r="4" fill="#294760"/><text x="102" y="290">Runs checks with its own tools</text>
    <circle cx="84" cy="326" r="4" fill="#294760"/><text x="102" y="332">Submits results and evidence</text>
    <circle cx="84" cy="368" r="4" fill="#294760"/><text x="102" y="374">Submits checks, not approvals</text>
  </g>
  <rect x="76" y="410" width="320" height="46" rx="9" fill="#eef2f7" stroke="#d7e0ea"/>
  <text x="92" y="439" font-size="14" class="muted">The agent proposes; the gate decides.</text>

  <!-- Middle: product -->
  <rect x="500" y="120" width="600" height="390" rx="16" class="product"/>
  <path d="M546 150 L562 157 V171 C562 182 553 189 546 192 C539 189 530 182 530 171 V157 Z" fill="url(#brand)"/>
  <path d="M539 171 L544 176 L554 164" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="580" y="160" font-size="26" font-weight="800">OpenGuardrail</text>
  <text x="580" y="186" font-size="15" class="muted">A standalone guardrail service</text>

  <line x1="528" y1="214" x2="1072" y2="214" stroke="#dbe8f6"/>

  <g>
    <text x="528" y="244" class="label blue">POLICY</text>
    <text x="528" y="272" font-size="21" font-weight="700">GuardrailSpec</text>
    <text x="528" y="298" font-size="15" class="muted">Checks · evidence requirements · immutable revisions</text>

    <text x="528" y="330" class="label blue">RUN</text>
    <text x="528" y="358" font-size="21" font-weight="700">Frozen context</text>
    <text x="528" y="384" font-size="15" class="muted">Policy revision · changeSet · evaluation deadline</text>

    <text x="528" y="416" class="label blue">DECISION</text>
    <text x="528" y="444" font-size="21" font-weight="700">ALLOW / DENY</text>
    <text x="528" y="470" font-size="15" class="muted">Validity window · accepted evidence · audit record</text>
  </g>

  <!-- Right: execution tool -->
  <rect x="1176" y="150" width="376" height="330" rx="14" class="card"/>
  <circle cx="1216" cy="190" r="22" fill="#e8eef5"/>
  <g transform="translate(1216 190)" class="icon" color="#294760">
    <rect x="-15" y="-12" width="30" height="24" rx="4"/>
    <path d="M-15 -5 H15 M-8 4 L-3 8 L-8 12 M2 12 H9"/>
  </g>
  <text x="1254" y="196" font-size="22" font-weight="700">Execution tool</text>
  <text x="1254" y="222" font-size="15" class="muted">Deploy · delete · change · configure</text>
  <line x1="1204" y1="248" x2="1524" y2="248" stroke="#e2e8f0"/>
  <text x="1204" y="276" font-size="15" font-weight="600">Verifies before acting:</text>
  <g font-size="15" class="muted">
    <circle cx="1212" cy="302" r="3.5" fill="#64778d"/><text x="1226" y="307">authoritative Run</text>
    <circle cx="1212" cy="330" r="3.5" fill="#64778d"/><text x="1226" y="335">decision validity</text>
    <circle cx="1212" cy="358" r="3.5" fill="#64778d"/><text x="1226" y="363">accepted evidence</text>
  </g>
  <rect x="1204" y="388" width="150" height="38" rx="8" fill="#e7f6ef" stroke="#a7d8c5"/>
  <text x="1279" y="412" text-anchor="middle" font-size="14" font-weight="700" class="green">ALLOW → act</text>
  <rect x="1370" y="388" width="150" height="38" rx="8" fill="#fdecea" stroke="#f3b8b2"/>
  <text x="1445" y="412" text-anchor="middle" font-size="14" font-weight="700" class="red">DENY → stop</text>

  <!-- Arrows -->
  <line x1="424" y1="315" x2="492" y2="315" stroke="#294760" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="458" y="298" text-anchor="middle" font-size="13" font-weight="600" class="muted">evidence</text>
  <line x1="1100" y1="315" x2="1168" y2="315" stroke="#294760" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="1134" y="298" text-anchor="middle" font-size="13" font-weight="600" class="muted">decision</text>

  <!-- Footer -->
  <text x="800" y="566" text-anchor="middle" font-size="14" class="muted">OpenGuardrail validates structure and completeness. The calling system verifies observations and applies the decision.</text>
</svg>
